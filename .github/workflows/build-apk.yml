name: Build Wear Messenger Bridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Android Environment & Accept Licenses
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Validate, Normalize & Ensure Gradle Wrapper
        run: |
          set -e
          sed -i 's/\r$//' ./gradlew || true
          chmod +x ./gradlew
          
          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::warning::gradle-wrapper.jar missing. Installing standalone Gradle to regenerate..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x ./gradlew
          fi

      - name: Assemble Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Check Output Directory
        if: always()
        run: |
          echo "Listing all files in build directory:"
          find . -name "*.apk" -o -name "outputs" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WearMessengerBridge-Debug
          path: |
            **/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: warn
