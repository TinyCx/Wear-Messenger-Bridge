name: Build Wear Messenger Bridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses" || true
        yes | sdkmanager --licenses || true

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Ensure Executable Gradle Wrapper
      run: |
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x ./gradlew

    - name: Build with Gradle
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: List Artifacts
      if: always()
      run: find . -type f -name "*.apk" -ls

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: WearMessengerBridge-Debug-APK
        path: "**/build/outputs/apk/**/*.apk"
        if-no-files-found: warn
