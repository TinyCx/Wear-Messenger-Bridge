name: Build Wear Messenger Bridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Assemble Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          if [ -f "./gradlew" ]; then
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --info --no-daemon
          else
            gradle assembleDebug --stacktrace --info --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WearMessengerBridge-Debug
          path: |
            **/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: warn
