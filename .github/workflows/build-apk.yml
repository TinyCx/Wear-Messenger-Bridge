name: Build Wear Messenger Bridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'
        cache-disabled: true

    - name: Find project and Build APK
      run: |
        BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          echo "Aucun fichier Gradle trouve. Contenu du depot :"
          ls -la
          exit 1
        fi
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Compilation depuis le dossier : $PROJECT_DIR"
        cd "$PROJECT_DIR"
        gradle assembleDebug --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: WearMessengerBridge-APK
        path: "**/*.apk"
        
